name: Release

# Ao publicar uma tag vX.Y.Z: confere que a tag bate com o package.json e com o CHANGELOG,
# roda a verificação completa e cria a release no GitHub. Não publica no npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Verificar e criar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag igual à versão do package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $pkg do package.json" >&2
            exit 1
          fi
      - name: Notas da versão no CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md não tem uma seção ## [$tag]" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
